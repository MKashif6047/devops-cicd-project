apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-cicd-app
  labels:
    app: devops-cicd-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: devops-cicd-app

  template:
    metadata:
      labels:
        app: devops-cicd-app

    spec:
      containers:
        - name: devops-cicd-app

          image: mkashif6047/devops-cicd-app:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          env:
            - name: NODE_ENV
              value: "production"

            - name: APP_VERSION
              value: "2.0.0"

            - name: BUILD_ID
              value: "f48047f"

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-cicd-app:1.0.0
    container_name: devops-cicd-app
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      APP_VERSION: "1.0.0"
      BUILD_ID: "compose-local"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s